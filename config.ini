[extraction]
# Comma-separated Datastream ticker codes.
tickers = AG:HCS, U:EFIV, A:VEFIX, A:VGADX, U:VDE, U:GII, A:IAFX, Z:MZYZ, Z:USMZ, A:BGBLX, U:TEI, @MSFT, Z:NZBB, U:EUAD, U:BBMC, U:SPHY, Z:SSP1, A:ESTXX, @IBIT
# Datastream datatype. RI = total return index.
fields = RI
# First data point for the one-time full seed.
start_date = 2000-01-31
# Frequency used for the seed and for the monthly master. Leave as M.
freq = M

[incremental]
# How many days back to look for the latest daily point (covers weekends/holidays).
daily_lookback_days = 14
# Authoritative accumulating file, kept in the output folder.
master_file = datastream_RI_master.csv

[output]
# Output subfolder, relative to this script.
folder = output
